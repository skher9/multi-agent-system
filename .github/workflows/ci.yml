# CI: lint, type-check, test, and build on every push and pull request.
# Needs no secrets: tests that need real services mock them or skip.
#
# Third-party actions are pinned to a full commit SHA (tags can be moved to
# point at different code; a SHA can't). The comment shows the release.
name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow can read the repo and nothing else.
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --locked # fail if uv.lock is out of date with pyproject.toml
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q # Docker sandbox tests skip here (no sandbox image)

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web build
        env:
          # Better Auth refuses to build without a secret. A fixed, public value is fine
          # here: CI only builds, nothing is signed or served. Real ones live in .env.local
          # and in the hosting platform's settings.
          BETTER_AUTH_SECRET: ci-build-only-not-a-real-secret-0123456789
      - name: API types match the backend
        run: |
          pnpm --filter web gen:api
          git diff --exit-code web/src/lib/api/ || {
            echo "::error::Generated API types are stale. Run 'pnpm --filter web gen:api' and commit."
            exit 1
          }

  template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/nextjs-starter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: templates/nextjs-starter/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: templates/nextjs-starter/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The Playwright e2e test runs in the sandbox image, not here (no browsers in CI).
