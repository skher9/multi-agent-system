# Local services for development. Start: docker compose up -d   Stop: docker compose down
services:
  redis:
    # Pinned minor version: patch updates only, never a surprise major upgrade.
    image: redis:8.10-alpine
    # Bound to 127.0.0.1 only: this Redis has no password, so it must not be
    # reachable from other machines on your network.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # The sandbox's only way to the internet, allowing registry.npmjs.org only.
  # It sits on both networks: the internal sandbox network and the normal one.
  npm-proxy:
    build: ./sandbox/proxy
    image: mas-npm-proxy
    container_name: npm-proxy
    networks:
      - sandbox
      - default
    restart: unless-stopped

networks:
  # internal: true = no route to the internet. Sandbox containers join only this
  # network, so anything that doesn't go through npm-proxy simply can't connect.
  sandbox:
    name: mas-sandbox
    internal: true

volumes:
  redis-data:
