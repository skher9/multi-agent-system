# Squid allow-list: the sandbox may reach registry.npmjs.org over HTTPS, nothing else.
http_port 3128

acl npm_registry dstdomain registry.npmjs.org
acl SSL_ports port 443
acl CONNECT method CONNECT

# HTTPS goes through CONNECT tunnels; only to port 443 of the registry.
http_access deny CONNECT !SSL_ports
http_access allow CONNECT npm_registry
http_access allow npm_registry
http_access deny all

# No disk cache (no cache_dir = memory only), and nothing stored.
cache deny all

# Squid runs as the unprivileged "squid" user, which can't write to the
# container's stdout. Logs go to files it owns. Inspect allowed/denied requests:
#   docker exec npm-proxy tail /var/log/squid/access.log
access_log /var/log/squid/access.log
cache_log /var/log/squid/cache.log
pid_filename none
