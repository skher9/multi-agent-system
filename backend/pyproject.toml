[project]
name = "multi-agent-system-backend"
version = "0.1.0"
description = "API, workers, and agents for the multi-agent system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.110",
    "celery[redis]>=5.6.3",
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.6",
    "pusher>=3.3.4",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.110",
    "moto>=5.2.3",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
# Setup guide rule: avoid package versions released in the last 14 days.
# Bump this date deliberately when upgrading dependencies.
exclude-newer = "2026-10-09T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors, I: import sorting, B: common bugs,
# UP: modern Python syntax, S: security checks (e.g. hardcoded secrets)
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests only: assert is how pytest works (S101); fake credentials are expected (S105/S106)
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.alembic]
script_location = "%(here)s/alembic"
prepend_sys_path = ["."]
# Date-first names sort in order, e.g. 2026_10_23_1530-ab12cd_initial_tables.py
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"

# Format every new migration file with ruff
[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"
